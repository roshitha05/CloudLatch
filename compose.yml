services:
  cloudlatch:
    build:
      context: .
    container_name: cloudlatch

    ports:
      - "8001:8000"

    environment:
      APP_VERSION: "1.0.0"
      APP_ENVIRONMENT: "local"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s